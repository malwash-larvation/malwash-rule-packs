name: Publish EDR Core v1

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable human-readable release tag
        required: true
        type: string
        default: core-v1-1
      rollout_stage:
        description: Initial rollout stage
        required: true
        type: choice
        options: [internal, canary]
        default: internal
      cohort_salt:
        description: Reviewed deterministic rollout cohort salt
        required: true
        type: string
        default: edr-core-v1-canary-6259

permissions:
  contents: read
  id-token: write
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/malwash-larvation/malwash-rule-packs
  BUNDLE: artifacts/core-v1
  COSIGN_VERSION: v3.0.6
  REKOR_URL: https://rekor.sigstore.dev
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_EXPERIMENTAL: "1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate checked-in bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BUNDLE/external-oci-manifest.json"
          test -f "$BUNDLE/pack-build-input.json"
          test -f "$BUNDLE/pack-manifest.json"
          test -f "$BUNDLE/config.json"
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile, datetime
          root = pathlib.Path('artifacts/core-v1')
          manifest = json.loads((root/'external-oci-manifest.json').read_text())
          pack = json.loads((root/'pack-manifest.json').read_text())
          assert manifest['artifactType'] == 'application/vnd.malwash.detection-pack.v1+json'
          assert len(manifest['layers']) == 6
          assert hashlib.sha256((root/'config.json').read_bytes()).hexdigest() == manifest['config']['digest'].split(':', 1)[1]
          built_at = int(datetime.datetime.fromisoformat(pack['deterministicBuild']['builtAt'].replace('Z', '+00:00')).timestamp())
          for layer in manifest['layers']:
              path = root/'layers'/next(p for p in ['manifest.tar.gz','runtime.tar.gz','catalog.tar.gz','fixtures.tar.gz','quality.tar.gz','provenance.tar.gz'] if layer['digest'] == 'sha256:'+hashlib.sha256((root/'layers'/p).read_bytes()).hexdigest())
              assert path.stat().st_size == layer['size']
              with tarfile.open(path, 'r:gz') as archive:
                  members = archive.getmembers()
                  assert members and all(member.mtime == built_at for member in members)
          print('BUNDLE_VALID')
          PY

      - name: Install pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o "$RUNNER_TEMP/cosign"
          chmod 0755 "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" version

      - name: Install pinned ORAS bootstrap client
        shell: bash
        run: |
          set -euo pipefail
          version=1.2.2
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${version}/oras_${version}_linux_amd64.tar.gz" -o /tmp/oras.tgz
          tar -xzf /tmp/oras.tgz -C /tmp oras
          install -m 0755 /tmp/oras "$RUNNER_TEMP/oras"
          "$RUNNER_TEMP/oras" version

      - name: Login to GHCR
        shell: bash
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push exact OCI manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          "$RUNNER_TEMP/oras" login ghcr.io -u "$GITHUB_ACTOR" -p "$CR_PAT"
          "$RUNNER_TEMP/oras" push "$IMAGE:bootstrap-${GITHUB_RUN_ID}" \
            --artifact-type application/vnd.malwash.detection-pack.v1+json \
            --config "$BUNDLE/config.json:application/vnd.oci.empty.v1+json" \
            "$BUNDLE/layers/manifest.tar.gz:application/vnd.malwash.detection.manifest.v1.tar+gzip" \
            "$BUNDLE/layers/runtime.tar.gz:application/vnd.malwash.detection.runtime.v1.tar+gzip" \
            "$BUNDLE/layers/catalog.tar.gz:application/vnd.malwash.detection.catalog.v1.tar+gzip" \
            "$BUNDLE/layers/fixtures.tar.gz:application/vnd.malwash.detection.fixtures.v1.tar+gzip" \
            "$BUNDLE/layers/quality.tar.gz:application/vnd.malwash.detection.quality.v1.tar+gzip" \
            "$BUNDLE/layers/provenance.tar.gz:application/vnd.malwash.detection.provenance.v1.tar+gzip"
          digest=$(sha256sum "$BUNDLE/external-oci-manifest.json" | awk '{print "sha256:"$1}')
          # Publish the exact canonical manifest through ORAS. A raw registry PUT
          # can leave GHCR serving the tag while the immutable digest route is not
          # addressable after retention; the verifier accepts digest-only reads.
          "$RUNNER_TEMP/oras" manifest push "$IMAGE:$RELEASE_TAG" "$BUNDLE/external-oci-manifest.json"
          "$RUNNER_TEMP/oras" manifest fetch "$IMAGE@$digest" > "$RUNNER_TEMP/readback-manifest.json"
          cmp "$BUNDLE/external-oci-manifest.json" "$RUNNER_TEMP/readback-manifest.json"
          echo "PACK_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Sign immutable digest keylessly
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/detection-pack.sigstore.json"
          "$RUNNER_TEMP/cosign" sign-blob "$BUNDLE/external-oci-manifest.json" --bundle "$bundle" --yes
          "$RUNNER_TEMP/cosign" verify-blob \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/publish-core-v1\.yml@" \
            --bundle "$bundle" "$BUNDLE/external-oci-manifest.json"
          "$RUNNER_TEMP/oras" attach "$IMAGE@$PACK_DIGEST" \
            --disable-path-validation \
            --artifact-type application/vnd.dev.sigstore.bundle.v0.3+json \
            --annotation dev.sigstore.bundle.content=message-signature \
            "$bundle:application/vnd.dev.sigstore.bundle.v0.3+json"

      - name: Verify signature and write receipt
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ROLLOUT_STAGE: ${{ inputs.rollout_stage }}
          COHORT_SALT: ${{ inputs.cohort_salt }}
        run: |
          set -euo pipefail
          [[ "$COHORT_SALT" =~ ^[a-z0-9][a-z0-9._-]{2,63}$ ]]
          signer="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-core-v1.yml@refs/heads/${GITHUB_REF_NAME}"
          "$RUNNER_TEMP/cosign" verify-blob \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/publish-core-v1\.yml@" \
            --bundle "$RUNNER_TEMP/detection-pack.sigstore.json" "$BUNDLE/external-oci-manifest.json" > "$RUNNER_TEMP/cosign-verify.json"
          build_input_digest="sha256:$(sha256sum "$BUNDLE/pack-build-input.json" | awk '{print $1}')"
          cohort_digest="sha256:$(python3 - "$COHORT_SALT" <<'PY'
          import hashlib, json, sys
          value = {"percentageBps": 1, "salt": sys.argv[1], "version": 1}
          print(hashlib.sha256(json.dumps(value, separators=(",", ":"), sort_keys=True).encode()).hexdigest())
          PY
          )"
          python3 - "$BUNDLE/publication-receipt.json" "$PACK_DIGEST" "$build_input_digest" "$signer" "$cohort_digest" "$ROLLOUT_STAGE" "$COHORT_SALT" <<'PY'
          import json, pathlib, sys
          out, pack, build, signer, cohort, stage, salt = sys.argv[1:]
          value = {
            'schemaVersion': 1,
            'kind': 'edr-core-v1-signed-publication-v1',
            'repository': 'ghcr.io/malwash-larvation/malwash-rule-packs',
            'packDigest': pack,
            'buildInputDigest': build,
            'signature': {
              'verified': True,
              'signerIdentity': signer,
              'oidcIssuer': 'https://token.actions.githubusercontent.com',
              'rekorUrl': 'https://rekor.sigstore.dev',
              'cosignVersion': 'v3.0.6',
              'receiptPath': 'publication-receipt.json',
            },
            'rollout': {'stage': stage, 'cohort': {'version': 1, 'salt': salt, 'percentageBps': 1, 'digest': cohort}},
          }
          pathlib.Path(out).write_text(json.dumps(value, separators=(',', ':'), sort_keys=True))
          PY
          mkdir -p "$RUNNER_TEMP/core-v1-publication"
          cp "$BUNDLE/publication-receipt.json" "$RUNNER_TEMP/core-v1-publication/"
          cp "$RUNNER_TEMP/cosign-verify.json" "$RUNNER_TEMP/core-v1-publication/"

      - name: Upload signed publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: core-v1-publication-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/core-v1-publication
